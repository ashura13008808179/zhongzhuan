<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Relay Station · AI API 服务中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="auth-view" id="authView">
    <div class="auth-art">
      <div class="brand">
        <div class="brand-mark"><i></i><i></i><i></i></div>
        <b>relay<span>station</span></b>
      </div>
      <div class="art-copy">
        <p class="eyebrow">DEVELOPER API PLATFORM</p>
        <h1>让每一次<br><em>调用</em>都更可靠。</h1>
        <p>统一接入主流模型，清晰掌控用量、账单与开发者密钥。</p>
      </div>
      <div class="art-foot">安全 · 稳定 · 透明 <span>⌁</span></div>
    </div>
    <div class="auth-card" id="authCard">
      <div class="mobile-brand brand">
        <div class="brand-mark"><i></i><i></i><i></i></div>
        <b>relay<span>station</span></b>
      </div>
      <div class="auth-tabs" role="tablist">
        <button class="active" data-auth="login" type="button" role="tab" aria-selected="true">登录</button>
        <button data-auth="register" type="button" role="tab" aria-selected="false">注册</button>
      </div>
      <div id="authMessage" class="auth-message"></div>
      <form id="loginForm" class="auth-form auth-form-login">
        <label>用户名 / 邮箱
          <input id="loginIdentifier" type="text" autocomplete="username" placeholder="用户名或邮箱" required>
        </label>
        <label>密码
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="输入密码" required>
        </label>
        <div class="form-row">
          <label class="check"><input type="checkbox"> 记住我</label>
        </div>
        <button class="primary-btn" type="submit">登录控制台 <span>↗</span></button>
      </form>
      <form id="registerForm" class="auth-form auth-form-register" hidden>
        <label>邮箱
          <input id="regEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label>用户名
          <input id="regUsername" type="text" autocomplete="username" placeholder="3-32 位字母数字下划线" required minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_-]{2,31}">
        </label>
        <label>显示名称 <span class="optional">可选</span>
          <input id="regName" autocomplete="nickname" placeholder="你的名字">
        </label>
        <label>密码
          <input id="regPassword" type="password" autocomplete="new-password" minlength="8" placeholder="至少 8 位字符" required>
        </label>
        <label>邀请码 <span class="optional">可选</span>
          <input id="regInvite" placeholder="有邀请码可获得奖励">
        </label>
        <button class="primary-btn" type="submit">创建账号 <span>↗</span></button>
      </form>
      <p class="auth-legal">继续即表示你同意 <a href="/terms.html" target="_blank">服务条款</a>、<a href="/privacy.html" target="_blank">隐私政策</a> 与 <a href="/refund.html" target="_blank">退款规则</a></p>
    </div>
  </div>
  <div class="dashboard" id="dashboard" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><i></i><i></i><i></i></div>
        <b>relay<span>station</span></b>
      </div>
      <div class="workspace">
        <span class="pulse"></span>
        <div><small>当前工作区</small><b>个人空间</b></div>
        <span>⌄</span>
      </div>
      <nav>
        <p>概览</p>
        <a class="active" data-page="overview">⌁ 数据概览</a>
        <a data-page="api">◈ API 接入</a>
        <a data-page="logs">◷ 使用日志</a>
        <p>账户</p>
        <a data-page="checkin">✦ 每日签到</a>
        <a data-page="billing">◇ 卡密充值</a>
        <a data-page="referral">♧ 邀请返利</a>
        <a data-page="contact">◎ 联系支持</a>
      </nav>
      <div class="side-bottom">
        <div class="side-tip">
          <span>✦</span>
          <div><b>需要帮助？</b><small>联系专属支持</small></div>
        </div>
        <div class="profile">
          <div class="avatar" id="sideAvatar">L</div>
          <div><b id="sideName">Lin Wei</b><small id="sideEmail">user@example.com</small></div>
          <button id="logoutBtn">↪</button>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <span class="crumb-muted">工作台</span>
          <b>/</b>
          <strong id="pageTitle">数据概览</strong>
        </div>
        <div class="top-right">
          <div class="status"><span class="pulse"></span> 服务运行正常</div>
          <button class="icon-btn">♢<i></i></button>
          <button class="avatar top-avatar" id="topAvatar">L</button>
        </div>
      </header>
      <section class="page" id="page"></section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
